<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Four filter mechanisms between your app and the person: summaries, cooldown, auto-bundling, focus modes</title>
  <desc id="d">Pipeline diagram. Left box: your app, what you send. Middle: the platform's AI filter with four mechanisms – summaries rewrite, cooldown throttles, auto-bundling stacks, focus modes silence. Right box: the person, what arrives. A yellow-accented line below states that what arrives is not what you sent.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 24px; font-weight: 700; }
    .s { font-size: 17px; fill: #5a6472; }
    .m { font-size: 20px; font-weight: 700; }
    .d { font-size: 17px; fill: #5a6472; }
    .end { fill: #ffffff; stroke: #1a2f6e; stroke-width: 2.5; }
    .filter { fill: #e2eefc; stroke: #1a2f6e; stroke-width: 2.5; }
    .mech { fill: #ffffff; stroke: #c7cdd4; stroke-width: 1.5; }
    .arrow { stroke: #1a2f6e; stroke-width: 3; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <g>
    <rect class="end" x="40" y="180" width="220" height="130" rx="16"/>
    <text class="h" x="150" y="238" text-anchor="middle">Your app</text>
    <text class="s" x="150" y="268" text-anchor="middle">what you send</text>
  </g>

  <line class="arrow" x1="260" y1="245" x2="316" y2="245"/>
  <path d="M 316 237 L 332 245 L 316 253 Z" fill="#1a2f6e"/>

  <g>
    <rect class="filter" x="340" y="60" width="520" height="380" rx="20"/>
    <text class="h" x="600" y="102" text-anchor="middle">The platform's AI filter</text>
    <text class="s" x="600" y="128" text-anchor="middle">on the user's device, since 2025</text>

    <rect class="mech" x="368" y="150" width="220" height="120" rx="14"/>
    <text class="m" x="478" y="192" text-anchor="middle">1 · Summaries</text>
    <text class="d" x="478" y="220" text-anchor="middle">rewrite your words</text>
    <text class="d" x="478" y="244" text-anchor="middle">iOS 26, Sept. 2025</text>

    <rect class="mech" x="612" y="150" width="220" height="120" rx="14"/>
    <text class="m" x="722" y="192" text-anchor="middle">2 · Cooldown</text>
    <text class="d" x="722" y="220" text-anchor="middle">throttles your salvos</text>
    <text class="d" x="722" y="244" text-anchor="middle">Android 16, June 2025</text>

    <rect class="mech" x="368" y="290" width="220" height="120" rx="14"/>
    <text class="m" x="478" y="332" text-anchor="middle">3 · Auto-bundling</text>
    <text class="d" x="478" y="360" text-anchor="middle">stacks your timing</text>
    <text class="d" x="478" y="384" text-anchor="middle">into line 4 of a digest</text>

    <rect class="mech" x="612" y="290" width="220" height="120" rx="14"/>
    <text class="m" x="722" y="332" text-anchor="middle">4 · Focus modes</text>
    <text class="d" x="722" y="360" text-anchor="middle">silence you by context</text>
    <text class="d" x="722" y="384" text-anchor="middle">taught by the platform</text>
  </g>

  <line class="arrow" x1="860" y1="245" x2="916" y2="245"/>
  <path d="M 916 237 L 932 245 L 916 253 Z" fill="#1a2f6e"/>

  <g>
    <rect class="end" x="940" y="180" width="220" height="130" rx="16"/>
    <text class="h" x="1050" y="238" text-anchor="middle">The person</text>
    <text class="s" x="1050" y="268" text-anchor="middle">what arrives</text>
  </g>

  <rect x="40" y="486" width="10" height="44" fill="#fcd430"/>
  <text class="h" x="70" y="506">The notification you write is not the notification that arrives.</text>
  <text class="s" x="70" y="532">Schematic, Sept. 2026 · platform states dated on the boxes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 851" role="img" aria-labelledby="t d">
  <title id="t">The semester at a glance: 13 topics, one 90-minute lecture each, two anchors, five exercise double sessions U1 to U5 plus backup date U6, three seminar-paper milestones, week 14 with defense slots</title>
  <desc id="d">Thirteen numbered topic cells in three rows, read left to right: 1 Claims and their sources; 2 Patterns as a language; 3 Severity, formula and rubric; 4 The fidelity decision; 5 Building with the machine; 6 Anchor I, the audit lab; 7 Friction by design; 8 Notifications, designing against the filter; 9 Offline states and sync conflicts, droppable first; 10 Dark patterns, naming and judging; 11 Anchor II, the Brussels hearing; 12 Defending your design, droppable second; 13 Apps and the agent thesis. Topics 6 and 11 are dark anchors. Blue tags below the rows mark the exercise double sessions, each merging two topics: U1 topics 1 and 2, U2 3 and 4, U3 5 and 6, U4 7 and 8, U5 9 and 10, U6 11 and 12 as backup date. A dashed cell marks week 14, the defense-slot session. Yellow tags mark the milestones: exposé in week 5, interim state in week 10, colloquium in the exam period.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Context rubric template: three criteria, each with a checkable "recognizable by" field and a grip test on a foreign UI</title>
  <desc id="d">Schema of the empty context rubric. Three rows for criteria one to three. Three columns: the criterion (what the grid does not cover), recognizable by (the checkable formulation, highlighted), and the grip test on a foreign UI with the options sharpen or strike. A footer line states: a criterion that never fails never worked.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 28px; font-weight: 700; }
    .meta { font-size: 20px; fill: #5a6472; }
    .colh { font-size: 21px; font-weight: 700; fill: #ffffff; }
    .colh-dark { font-size: 21px; font-weight: 700; fill: #031121; }
    .sub { font-size: 16px; fill: #dfe5ff; }
    .sub-dark { font-size: 16px; fill: #4a4630; }
    .rowl { font-size: 20px; font-weight: 700; }
    .hint { font-size: 17px; fill: #5a6472; }
    .line { stroke: #c7cdd4; stroke-width: 1.5; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <text class="h" x="40" y="52">Context rubric – template</text>
  <text class="meta" x="40" y="88">Three criteria the NN/g grid does not cover · built per group, then swapped and tested</text>

  <!-- Column headers -->
  <g>
    <rect x="40"  y="120" width="360" height="70" fill="#1a2f6e"/>
    <rect x="400" y="120" width="420" height="70" fill="#fcd430"/>
    <rect x="820" y="120" width="340" height="70" fill="#1a2f6e"/>
    <text class="colh" x="56" y="150">Criterion</text>
    <text class="sub"  x="56" y="176">what the grid does not cover</text>
    <text class="colh-dark" x="416" y="150">Recognizable by …</text>
    <text class="sub-dark"  x="416" y="176">checkable – how do you see fulfilment?</text>
    <text class="colh" x="836" y="150">Grip test on a foreign UI</text>
    <text class="sub"  x="836" y="176">did it grip? sharpen or strike</text>
  </g>

  <!-- Rows -->
  <line class="line" x1="40" y1="190" x2="1160" y2="190"/>
  <line class="line" x1="40" y1="280" x2="1160" y2="280"/>
  <line class="line" x1="40" y1="370" x2="1160" y2="370"/>
  <line class="line" x1="40" y1="460" x2="1160" y2="460"/>
  <line class="line" x1="400" y1="190" x2="400" y2="460"/>
  <line class="line" x1="820" y1="190" x2="820" y2="460"/>
  <line class="line" x1="40"  y1="190" x2="40"  y2="460"/>
  <line class="line" x1="1160" y1="190" x2="1160" y2="460"/>

  <text class="rowl" x="56" y="240">1</text>
  <text class="rowl" x="56" y="330">2</text>
  <text class="rowl" x="56" y="420">3</text>
  <text class="hint" x="836" y="240">□ sharpen   □ strike</text>
  <text class="hint" x="836" y="330">□ sharpen   □ strike</text>
  <text class="hint" x="836" y="420">□ sharpen   □ strike</text>

  <text class="hint" x="40" y="520">A criterion that never fails never worked. (T03 rule)</text>
  <text class="hint" x="40" y="546">Typical members after the merge: one-handed viability · failure-moment honesty · empty-data states · interruptibility</text>
</svg>

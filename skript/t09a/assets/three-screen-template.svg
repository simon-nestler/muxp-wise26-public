<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">The three-screen template for the conflict flow: detection, decision, confirmation</title>
  <desc id="d">Three phone frames side by side, connected by arrows. Screen 1, detection: says that a conflict happened and what is at stake. Screen 2, decision: the choice, in the user's words, never in machine terms. Screen 3, confirmation: what happened to the user's work. Each screen carries a numbered badge.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .h { font-size: 25px; font-weight: 700; }
    .line { font-size: 19px; fill: #031121; }
    .meta { font-size: 17px; fill: #5a6472; }
    .phone { fill: #f5f3ee; stroke: #5a6472; stroke-width: 2.5; }
    .card { fill: #ffffff; stroke: #c7cdd4; stroke-width: 1.5; }
    .flow { stroke: #031121; stroke-width: 2.5; fill: none; }
    .badge { font-size: 24px; font-weight: 700; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#031121"/>
    </marker>
  </defs>

  <!-- screen 1: detection -->
  <rect x="80" y="70" width="280" height="420" rx="24" class="phone"/>
  <circle cx="110" cy="102" r="20" fill="#fcd430" stroke="#031121" stroke-width="2"/>
  <text x="110" y="111" class="badge" text-anchor="middle">1</text>
  <text x="145" y="110" class="h">Detection</text>
  <rect x="105" y="140" width="230" height="90" rx="8" class="card"/>
  <text x="120" y="175" class="line">a conflict happened</text>
  <text x="120" y="203" class="meta">say it – do not hide it</text>
  <rect x="105" y="245" width="230" height="90" rx="8" class="card"/>
  <text x="120" y="280" class="line">what is at stake</text>
  <text x="120" y="308" class="meta">whose work, which record</text>
  <text x="105" y="455" class="meta">never: vector clocks,</text>
  <text x="105" y="477" class="meta">replica IDs, CRDT internals</text>

  <path class="flow" d="M 370 280 L 435 280" marker-end="url(#arr)"/>

  <!-- screen 2: decision -->
  <rect x="450" y="70" width="280" height="420" rx="24" class="phone"/>
  <circle cx="480" cy="102" r="20" fill="#fcd430" stroke="#031121" stroke-width="2"/>
  <text x="480" y="111" class="badge" text-anchor="middle">2</text>
  <text x="515" y="110" class="h">Decision</text>
  <rect x="475" y="140" width="230" height="70" rx="8" class="card"/>
  <text x="490" y="182" class="line">the choice, in the</text>
  <rect x="475" y="225" width="230" height="70" rx="8" class="card"/>
  <text x="490" y="267" class="line">user's words</text>
  <rect x="475" y="310" width="230" height="70" rx="8" class="card"/>
  <text x="490" y="352" class="line">both options honest</text>
  <text x="475" y="455" class="meta">what does each choice</text>
  <text x="475" y="477" class="meta">do to whose work?</text>

  <path class="flow" d="M 740 280 L 805 280" marker-end="url(#arr)"/>

  <!-- screen 3: confirmation -->
  <rect x="820" y="70" width="280" height="420" rx="24" class="phone"/>
  <circle cx="850" cy="102" r="20" fill="#fcd430" stroke="#031121" stroke-width="2"/>
  <text x="850" y="111" class="badge" text-anchor="middle">3</text>
  <text x="885" y="110" class="h">Confirmation</text>
  <rect x="845" y="140" width="230" height="90" rx="8" class="card"/>
  <text x="860" y="175" class="line">what happened</text>
  <text x="860" y="203" class="line">to their work</text>
  <rect x="845" y="245" width="230" height="90" rx="8" class="card"/>
  <text x="860" y="280" class="line">kept · replaced · merged</text>
  <text x="860" y="308" class="meta">named, not implied</text>
  <text x="845" y="455" class="meta">"work" is the emotional</text>
  <text x="845" y="477" class="meta">word – and the right one</text>
</svg>

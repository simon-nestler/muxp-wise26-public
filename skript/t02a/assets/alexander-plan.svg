<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">A Gothic cathedral floor plan beside a mobile app wireframe – one pattern language, two kinds of built things</title>
  <desc id="d">Left: the ground plan of a Gothic cathedral as a Latin cross with columns and an apse. Right: the wireframe of a mobile app with a header, list rows and a bottom bar. Between them an arrow from 1977 to 2026. Christopher Alexander's point was never repetition, but a shared language about the quality of built things.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .cap { font-size: 22px; font-weight: 700; }
    .sub { font-size: 18px; fill: #5a6472; }
    .mid { font-size: 20px; fill: #5a6472; text-anchor: middle; }
    .plan { fill: none; stroke: #1a2f6e; stroke-width: 3; }
    .col { fill: #5a6472; }
    .wf { fill: #e6e9ee; }
  </style>
  <rect width="1200" height="560" fill="#ffffff"/>

  <!-- Cathedral floor plan: Latin cross, apse to the right -->
  <path class="plan" d="M 70 210 L 300 210 L 300 150 L 390 150 L 390 210 L 440 210 A 80 80 0 0 1 440 370 L 390 370 L 390 430 L 300 430 L 300 370 L 70 370 Z"/>
  <!-- Apse accent: the named place -->
  <path d="M 444 218 A 72 72 0 0 1 444 362" fill="none" stroke="#fcd430" stroke-width="8"/>
  <!-- Columns, two rows along the nave -->
  <g>
    <circle class="col" cx="120" cy="250" r="6"/><circle class="col" cx="180" cy="250" r="6"/><circle class="col" cx="240" cy="250" r="6"/><circle class="col" cx="300" cy="250" r="6"/><circle class="col" cx="360" cy="250" r="6"/>
    <circle class="col" cx="120" cy="330" r="6"/><circle class="col" cx="180" cy="330" r="6"/><circle class="col" cx="240" cy="330" r="6"/><circle class="col" cx="300" cy="330" r="6"/><circle class="col" cx="360" cy="330" r="6"/>
  </g>
  <text class="cap" x="70" y="490">Floor plan · Gothic cathedral</text>
  <text class="sub" x="70" y="520">nave · transept · apse – named, recurring, refined by use</text>

  <!-- Arrow between the two -->
  <line x1="560" y1="290" x2="700" y2="290" stroke="#5a6472" stroke-width="3"/>
  <path d="M 700 290 l -14 -8 l 0 16 Z" fill="#5a6472"/>
  <text class="mid" x="630" y="262">1977 → 2026</text>

  <!-- App wireframe -->
  <rect x="790" y="70" width="250" height="420" rx="24" fill="none" stroke="#031121" stroke-width="3"/>
  <rect x="804" y="92" width="222" height="44" fill="#1a2f6e"/>
  <g>
    <circle cx="830" cy="180" r="14" class="wf"/><rect class="wf" x="858" y="168" width="150" height="10" rx="5"/><rect class="wf" x="858" y="186" width="104" height="10" rx="5"/>
    <circle cx="830" cy="240" r="14" class="wf"/><rect class="wf" x="858" y="228" width="150" height="10" rx="5"/><rect class="wf" x="858" y="246" width="104" height="10" rx="5"/>
    <circle cx="830" cy="300" r="14" class="wf"/><rect class="wf" x="858" y="288" width="150" height="10" rx="5"/><rect class="wf" x="858" y="306" width="104" height="10" rx="5"/>
  </g>
  <rect x="826" y="352" width="178" height="40" rx="20" fill="#fcd430"/>
  <line x1="792" y1="424" x2="1038" y2="424" stroke="#c7cdd4" stroke-width="2"/>
  <g>
    <circle class="col" cx="838" cy="454" r="8"/><circle class="col" cx="890" cy="454" r="8"/><circle class="col" cx="942" cy="454" r="8"/><circle class="col" cx="994" cy="454" r="8"/>
  </g>
  <text class="cap" x="790" y="524">Wireframe · mobile app</text>
  <text class="sub" x="790" y="554">tab bar · list · primary action – named, recurring, refined by use</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">The iteration loop: name the decision, force a variant, compare, log what you discarded</title>
  <desc id="d">Four boxes arranged in a clockwise cycle. Step 1: name the decision. Step 2: force a variant. Step 3: compare. Step 4, highlighted in yellow: log what you discarded. The caption notes that step 4 is the one everyone skips and the only one the exam sees.</desc>
  <style>
    text { font-family: Inter, "Neue Haas Unica", Helvetica, Arial, sans-serif; fill: #031121; }
    .n { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .num { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .c { font-size: 24px; font-weight: 700; text-anchor: middle; fill: #1a2f6e; }
    .cap { font-size: 17px; fill: #5a6472; }
    .box { fill: #ffffff; stroke: #1a2f6e; stroke-width: 2.5; }
    .box.akzent { fill: #fcd430; }
    .arrow { fill: none; stroke: #5a6472; stroke-width: 3; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6472"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>

  <path class="arrow" d="M 745 95 Q 990 95 990 230" marker-end="url(#ah)"/>
  <path class="arrow" d="M 990 330 Q 990 465 745 465" marker-end="url(#ah)"/>
  <path class="arrow" d="M 455 465 Q 210 465 210 330" marker-end="url(#ah)"/>
  <path class="arrow" d="M 210 230 Q 210 95 455 95" marker-end="url(#ah)"/>

  <rect class="box" x="460" y="50" width="280" height="90" rx="10"/>
  <circle cx="490" cy="80" r="17" fill="#1a2f6e"/>
  <text class="num" x="490" y="86">1</text>
  <text class="n" x="615" y="102">name the decision</text>

  <rect class="box" x="850" y="235" width="280" height="90" rx="10"/>
  <circle cx="880" cy="265" r="17" fill="#1a2f6e"/>
  <text class="num" x="880" y="271">2</text>
  <text class="n" x="1005" y="287">force a variant</text>

  <rect class="box" x="460" y="420" width="280" height="90" rx="10"/>
  <circle cx="490" cy="450" r="17" fill="#1a2f6e"/>
  <text class="num" x="490" y="456">3</text>
  <text class="n" x="615" y="472">compare</text>

  <rect class="box akzent" x="70" y="235" width="280" height="90" rx="10"/>
  <circle cx="100" cy="265" r="17" fill="#1a2f6e"/>
  <text class="num" x="100" y="271">4</text>
  <text class="n" x="225" y="279">log what</text>
  <text class="n" x="225" y="305">you discarded</text>

  <text class="c" x="600" y="272">iterate,</text>
  <text class="c" x="600" y="302">don't accept</text>

  <text class="cap" x="70" y="548">Step 4 is the one everyone skips – and the only one the exam sees.</text>
</svg>
